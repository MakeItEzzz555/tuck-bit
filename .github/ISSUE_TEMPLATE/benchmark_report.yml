name: Native activation or benchmark report
description: Share a sanitized reproducible TuckBit result.
title: "[Evaluation] "
labels: ["evaluation", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        We value verified correct outcomes rather than isolated token numbers.
        Do not upload private source, raw session exports, credentials, or personal prompts.
  - type: input
    id: client
    attributes:
      label: Host and model versions
      placeholder: "e.g. Codex CLI X with model Y"
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Public, reproducible task
    validations:
      required: true
  - type: textarea
    id: conditions
    attributes:
      label: Baseline and TuckBit conditions; number of trials
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Acceptance criteria and correct-outcome results
    validations:
      required: true
  - type: textarea
    id: metrics
    attributes:
      label: Measured tokens, tool calls, latency, costs and limitations
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Data safety
      options:
        - label: All examples are sanitized and safe to share publicly.
          required: true
