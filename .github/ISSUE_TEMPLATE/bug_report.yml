name: Bug report
description: Report a reproducible TuckBit issue without sensitive data.
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please use a minimal synthetic example.
        Do not upload credentials, personal paths, private transcripts or raw MCP outputs.
        Security vulnerabilities belong in private vulnerability reporting.
  - type: input
    id: component
    attributes:
      label: Component
      placeholder: "e.g. installer / registry / router / plugin"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Host, version, and operating system
      placeholder: "e.g. Claude Code version X on macOS Y"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include a sanitized input and exact command.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual result
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Relevant tests or sanitized error classification (optional)
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Data safety
      options:
        - label: This report contains no credentials, personal data, or private conversations.
          required: true
