name: Phase 1 validation
on:
  push:
  pull_request:
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check distribution
        run: python3 scripts/tuckbit.py doctor
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
