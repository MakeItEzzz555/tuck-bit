name: Phase 1 validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Check distribution
        run: python3 scripts/tuckbit.py doctor
      - name: Confirm distribution manifests are synchronized
        run: python3 scripts/sync_distributions.py --check
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate multilingual docs and opt-in skills (no model)
        run: python3 scripts/check_i18n.py
      - name: Public-source privacy audit
        run: python3 scripts/public_audit.py
      - name: No-model install and metadata smoke test
        run: python3 scripts/smoke_free.py
      - name: Verify adaptive workflow policy corpus
        run: python3 scripts/eval_routing.py
      - name: Reproducible offline task bundle self-test (no AI calls)
        run: |
          python3 scripts/repeat_bundle.py --bundle evals/bundles/offline-v1.json --output /tmp/tuckbit-offline-ci-report.json
          python3 -c "import json; r=json.load(open('/tmp/tuckbit-offline-ci-report.json')); assert r['total_passes'] == r['total_trials'] == 24; assert len({t['starting_commit'] for t in r['records']}) == 1"
      - name: Smoke-test provider routing examples
        run: |
          python3 scripts/workflow_router.py examples/workflow-incident.json > /dev/null
          python3 scripts/workflow_router.py examples/workflow-parallel.json > /dev/null
          python3 scripts/workflow_router.py examples/workflow-loop.json > /dev/null
      - name: Validate explicit capability discovery and freshness
        run: |
          python3 scripts/capability_registry.py build --root skills --tools-file examples/tool-metadata.synthetic.json --output /tmp/tuckbit-ci-index.json
          python3 scripts/capability_registry.py query --snapshot /tmp/tuckbit-ci-index.json --text "Swift regression tests" --limit 5 > /dev/null
          python3 scripts/capability_registry.py verify --snapshot /tmp/tuckbit-ci-index.json --root skills --tools-file examples/tool-metadata.synthetic.json
      - name: Compare synthetic redacted traces and route advisory observations
        run: |
          python3 scripts/trace_profiler.py compare --baseline examples/trace-baseline.synthetic.json --candidate examples/trace-candidate.synthetic.json > /dev/null
          python3 scripts/workflow_router.py examples/workflow-incident.json --registry-snapshot /tmp/tuckbit-ci-index.json --trace examples/trace-baseline.synthetic.json > /dev/null
