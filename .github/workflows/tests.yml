name: Phase 1 validation
on:
  push:
  pull_request:
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check distribution
        run: python3 scripts/tuckbit.py doctor
      - name: Confirm distribution manifests are synchronized
        run: python3 scripts/sync_distributions.py --check
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: No-model install and metadata smoke test
        run: python3 scripts/smoke_free.py
      - name: Verify adaptive workflow policy corpus
        run: python3 scripts/eval_routing.py
      - name: Smoke-test provider routing examples
        run: |
          python3 scripts/workflow_router.py examples/workflow-incident.json > /dev/null
          python3 scripts/workflow_router.py examples/workflow-parallel.json > /dev/null
          python3 scripts/workflow_router.py examples/workflow-loop.json > /dev/null
