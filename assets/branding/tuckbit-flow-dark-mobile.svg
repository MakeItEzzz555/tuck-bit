<svg xmlns="http://www.w3.org/2000/svg" width="600" height="840" viewBox="0 0 600 840" role="img" aria-labelledby="title desc"><title id="title">TuckBit: from intent to a verified result</title><desc id="desc">The full user request, constraints and permissions feed into scoped tool and context selection; mandatory checks and evidence stay in the final handoff.</desc><rect x="0" y="0" width="600" height="840" rx="0" fill="#090F19" /><text x="40" y="73" fill="#F5F9FF" font-family="Arial,Helvetica,sans-serif" font-size="43" font-weight="700" letter-spacing="-1.3" text-anchor="start">Make every tool</text><text x="40" y="119" fill="#4C9BFF" font-family="Arial,Helvetica,sans-serif" font-size="43" font-weight="700" letter-spacing="-1.3" text-anchor="start">call count.</text><text x="40" y="157" fill="#C0CFE2" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" letter-spacing="0" text-anchor="start">Scope what matters. Keep every required check.</text><text x="40" y="214" fill="#F5F9FF" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" letter-spacing="-0.5" text-anchor="start">The complete request</text><text x="40" y="247" fill="#C0CFE2" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" letter-spacing="0" text-anchor="start">Constraints and permissions stay intact.</text><circle cx="54" cy="284" r="4" fill="#748AA5" /><line x1="62" y1="284" x2="278" y2="284" stroke="#344961" stroke-width="2" opacity="1" /><circle cx="54" cy="305" r="4" fill="#4C9BFF" /><line x1="62" y1="305" x2="278" y2="305" stroke="#4C9BFF" stroke-width="3" opacity="1" /><circle cx="54" cy="326" r="4" fill="#748AA5" /><line x1="62" y1="326" x2="278" y2="326" stroke="#344961" stroke-width="2" opacity="1" /><path d="M278 284 C327 284 342 320 342 367" fill="none" stroke="#344961" stroke-width="2" opacity="1" stroke-linecap="round" stroke-linejoin="round" /><path d="M278 305 C317 305 342 324 342 367" fill="none" stroke="#4C9BFF" stroke-width="3.5" opacity="1" stroke-linecap="round" stroke-linejoin="round" /><path d="M278 326 C307 326 342 338 342 367" fill="none" stroke="#344961" stroke-width="2" opacity="1" stroke-linecap="round" stroke-linejoin="round" /><line x1="342" y1="367" x2="342" y2="415" stroke="#4C9BFF" stroke-width="3.5" opacity="1" /><circle cx="342" cy="452" r="38" fill="#090F19" stroke="#344961" stroke-width="2" /><path d="M318 468 C300 445 319 423 332 419" fill="none" stroke="#4C9BFF" stroke-width="4" opacity="1" stroke-linecap="round" stroke-linejoin="round" /><path d="M352 421 C375 434 367 465 352 480" fill="none" stroke="#4C9BFF" stroke-width="4" opacity="1" stroke-linecap="round" stroke-linejoin="round" /><path d="M329 452 H350 M342 445 L350 452 342 459" fill="none" stroke="#F5F9FF" stroke-width="3" opacity="1" stroke-linecap="round" stroke-linejoin="round" /><text x="40" y="385" fill="#F5F9FF" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" letter-spacing="-0.5" text-anchor="start">Focus the work</text><text x="40" y="413" fill="#C0CFE2" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" letter-spacing="0" text-anchor="start">Relevant context and tools.</text><line x1="342" y1="490" x2="342" y2="562" stroke="#4C9BFF" stroke-width="3.5" opacity="1" /><path d="M342 562 C342 584 324 592 310 592 H64" fill="none" stroke="#4C9BFF" stroke-width="3.5" opacity="1" stroke-linecap="round" stroke-linejoin="round" /><circle cx="64" cy="592" r="6" fill="#4C9BFF" /><text x="40" y="637" fill="#F5F9FF" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" letter-spacing="-0.5" text-anchor="start">Verify and hand off</text><text x="40" y="668" fill="#C0CFE2" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" letter-spacing="0" text-anchor="start">Required tests and evidence.</text><circle cx="51" cy="711" r="7" fill="#4C9BFF" /><text x="66" y="718" fill="#F5F9FF" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" letter-spacing="0" text-anchor="start">Checks</text><circle cx="241" cy="711" r="7" fill="#4C9BFF" /><text x="256" y="718" fill="#F5F9FF" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" letter-spacing="0" text-anchor="start">Approvals</text><circle cx="429" cy="711" r="7" fill="#4C9BFF" /><text x="444" y="718" fill="#F5F9FF" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="600" letter-spacing="0" text-anchor="start">Receipt</text><text x="40" y="813" fill="#748AA5" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" letter-spacing="0" text-anchor="start">Advisory guidance. Native permissions remain authoritative.</text></svg>
