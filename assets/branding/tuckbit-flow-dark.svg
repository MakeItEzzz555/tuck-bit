<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="410" viewBox="0 0 1160 410" role="img" aria-labelledby="title desc"><title id="title">TuckBit: from intent to a verified result</title><desc id="desc">The full user request, constraints and permissions feed into scoped tool and context selection; mandatory checks and evidence stay in the final handoff.</desc><rect x="0" y="0" width="1160" height="410" rx="0" fill="#090F19" /><text x="44" y="69" fill="#F5F9FF" font-family="Arial,Helvetica,sans-serif" font-size="45" font-weight="700" letter-spacing="-1.5" text-anchor="start">Make every tool call count.</text><text x="46" y="107" fill="#C0CFE2" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" letter-spacing="0" text-anchor="start">Scope what matters. Keep every required check.</text><text x="1110" y="69" fill="#748AA5" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" letter-spacing="1.0" text-anchor="end">TUCKBIT / EXECUTION PATH</text><text x="44" y="181" fill="#F5F9FF" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" letter-spacing="-0.5" text-anchor="start">Original request</text><text x="45" y="210" fill="#C0CFE2" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" letter-spacing="0" text-anchor="start">Task, constraints, approved tools</text><text x="45" y="244" fill="#748AA5" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" letter-spacing="0" text-anchor="start">Nothing important gets discarded.</text><circle cx="50" cy="280" r="5" fill="#748AA5" /><line x1="59" y1="280" x2="330" y2="280" stroke="#344961" stroke-width="2" opacity="1" /><circle cx="50" cy="304" r="5" fill="#4C9BFF" /><line x1="59" y1="304" x2="330" y2="304" stroke="#4C9BFF" stroke-width="3" opacity="1" /><circle cx="50" cy="328" r="5" fill="#748AA5" /><line x1="59" y1="328" x2="330" y2="328" stroke="#344961" stroke-width="2" opacity="1" /><path d="M330 280 C412 280 435 304 501 304" fill="none" stroke="#344961" stroke-width="2" opacity="1" stroke-linecap="round" stroke-linejoin="round" /><path d="M330 304 H501" fill="none" stroke="#4C9BFF" stroke-width="3.5" opacity="1" stroke-linecap="round" stroke-linejoin="round" /><path d="M330 328 C414 328 435 304 501 304" fill="none" stroke="#344961" stroke-width="2" opacity="1" stroke-linecap="round" stroke-linejoin="round" /><circle cx="501" cy="304" r="6" fill="#4C9BFF" /><circle cx="561" cy="304" r="47" fill="#090F19" stroke="#344961" stroke-width="2" /><path d="M531 328 C511 306 525 274 549 268" fill="none" stroke="#4C9BFF" stroke-width="5" opacity="1" stroke-linecap="round" stroke-linejoin="round" /><path d="M580 271 C604 292 598 319 574 337" fill="none" stroke="#4C9BFF" stroke-width="5" opacity="1" stroke-linecap="round" stroke-linejoin="round" /><path d="M550 304 H572 M562 296 L572 304 562 312" fill="none" stroke="#F5F9FF" stroke-width="4" opacity="1" stroke-linecap="round" stroke-linejoin="round" /><text x="561" y="236" fill="#F5F9FF" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" letter-spacing="-0.2" text-anchor="middle">Select relevant context</text><text x="561" y="258" fill="#C0CFE2" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" letter-spacing="0" text-anchor="middle">and tools on demand</text><path d="M608 304 H786 C816 304 822 286 844 286" fill="none" stroke="#4C9BFF" stroke-width="3.5" opacity="1" stroke-linecap="round" stroke-linejoin="round" /><circle cx="844" cy="286" r="6" fill="#4C9BFF" /><text x="846" y="182" fill="#F5F9FF" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" letter-spacing="-0.5" text-anchor="start">Verified handoff</text><text x="846" y="211" fill="#C0CFE2" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" letter-spacing="0" text-anchor="start">Required checks stay intact</text><circle cx="854" cy="253" r="9" fill="#14243A" /><path d="M849 253 L853 257 L860 248" fill="none" stroke="#4C9BFF" stroke-width="2.5" opacity="1" stroke-linecap="round" stroke-linejoin="round" /><text x="873" y="258" fill="#F5F9FF" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" letter-spacing="0" text-anchor="start">Correct outcome</text><circle cx="854" cy="286" r="9" fill="#14243A" /><path d="M849 286 L853 290 L860 281" fill="none" stroke="#4C9BFF" stroke-width="2.5" opacity="1" stroke-linecap="round" stroke-linejoin="round" /><text x="873" y="291" fill="#F5F9FF" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" letter-spacing="0" text-anchor="start">Native approvals</text><circle cx="854" cy="319" r="9" fill="#14243A" /><path d="M849 319 L853 323 L860 314" fill="none" stroke="#4C9BFF" stroke-width="2.5" opacity="1" stroke-linecap="round" stroke-linejoin="round" /><text x="873" y="324" fill="#F5F9FF" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" letter-spacing="0" text-anchor="start">Evidence receipt</text><line x1="44" y1="139" x2="1116" y2="139" stroke="#344961" stroke-width="1" opacity="1" /><text x="44" y="129" fill="#748AA5" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="1.8" text-anchor="start">REQUEST</text><text x="561" y="129" fill="#748AA5" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="1.8" text-anchor="middle">FOCUSED DISCOVERY</text><text x="1116" y="129" fill="#748AA5" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="1.8" text-anchor="end">REQUIRED VERIFICATION</text><line x1="44" y1="364" x2="1115" y2="364" stroke="#344961" stroke-width="1" opacity="1" /><text x="44" y="391" fill="#748AA5" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" letter-spacing="0" text-anchor="start">Agent-native permissions remain authoritative.</text><text x="1116" y="391" fill="#748AA5" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" letter-spacing="1" text-anchor="end">INTENT    ·    ROUTING    ·    EVIDENCE</text></svg>
