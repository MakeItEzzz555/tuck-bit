<text x="139" y="323" fill="#42566E" font-size="23" letter-spacing="2" font-weight="700" font-family="Arial,sans-serif">ROUTE</text>
<text x="58" y="375" fill="#152337" font-size="36" font-weight="700" font-family="Arial,sans-serif">Focus the work</text>
<text x="58" y="417" fill="#42566E" font-size="25" font-family="Arial,sans-serif">Relevant context + tools</text>
<path d="M300 450 v25 m-9 -9 l9 9 9 -9" fill="none" stroke="#1465E8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
